name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate, test and build
        run: npm run validate
      - name: Built-site smoke test
        run: npm run site-smoke
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: route-story-studio-site
          path: dist
          if-no-files-found: error
          retention-days: 14
  browser-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser and accessibility tests
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-assurance
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
