name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run project checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: route-story-studio-site
          path: dist
