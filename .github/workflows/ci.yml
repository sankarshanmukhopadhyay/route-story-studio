name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate, test and build
        run: npm run validate
      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: route-story-studio-site
          path: dist
