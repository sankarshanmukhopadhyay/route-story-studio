name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or repair, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate release
        run: npm run release-check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser assurance
        run: npm run test:e2e

      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse "$TAG^{commit}" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package built site
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          tar -czf "route-story-studio-${RELEASE_TAG}.tar.gz" -C dist .
          sha256sum "route-story-studio-${RELEASE_TAG}.tar.gz" SBOM.spdx.json > checksums.txt

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Route Story Studio $RELEASE_TAG: Local GPX Studio" \
              --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" \
              "route-story-studio-${RELEASE_TAG}.tar.gz" \
              SBOM.spdx.json \
              checksums.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "Route Story Studio $RELEASE_TAG: Local GPX Studio" \
              --notes-file RELEASE_NOTES.md \
              "route-story-studio-${RELEASE_TAG}.tar.gz" \
              SBOM.spdx.json \
              checksums.txt
          fi
