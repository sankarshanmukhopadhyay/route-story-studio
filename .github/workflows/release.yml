name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate release
        run: npm run release-check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser assurance
        run: npm run test:e2e
      - name: Package built site
        run: |
          tar -czf route-story-studio-${GITHUB_REF_NAME}.tar.gz -C dist .
          sha256sum route-story-studio-${GITHUB_REF_NAME}.tar.gz SBOM.spdx.json > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Route Story Studio ${GITHUB_REF_NAME}: Local GPX Studio" \
            --notes-file RELEASE_NOTES.md \
            route-story-studio-${GITHUB_REF_NAME}.tar.gz \
            SBOM.spdx.json \
            checksums.txt
